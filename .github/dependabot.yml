version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kathmandu
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kathmandu
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
