name: Vercel Preview

# Deploys each push to a ready-for-review PR from this repository and comments the URL.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", "apps/web/e2e/**", "bench/**"]

permissions: {}

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs repository code, so the token only reaches `vercel pull`, which runs before any of it.
  build:
    # Fork and Dependabot PRs get no secrets, so a deploy could only fail.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: vercel-preview
    permissions:
      contents: read
    env:
      VERCEL: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/vercel
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --cwd .github/vercel-cli
      - run: '"$VERCEL" pull --yes --environment=preview'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: '"$VERCEL" build'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-build
          path: |
            .vercel/project.json
            .vercel/output/
          include-hidden-files: true
          retention-days: 1

  # Holds the token and runs no repository code: only the pinned CLI on the built output.
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: vercel-preview
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/vercel
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/vercel-cli
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --cwd .github/vercel-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-build
          path: .vercel
      - id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # One archive upload instead of one request per file.
        run: echo "url=$("$VERCEL" deploy --prebuilt --archive=tgz)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** $URL (commit \`${SHA:0:7}\`)"
